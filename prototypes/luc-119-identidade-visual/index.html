<title>PROTÓTIPO · Bat-Computer · identidade visual (LUC-119)</title>
<!--
  PROTÓTIPO DESCARTÁVEL (LUC-119). Não é código de produção.
  Pergunta: qual identidade visual o Bat-Computer segue?
  Três variações das três telas (lista, detalhes com logs, formulário), trocadas por
  ?variant=A|B|C, com ?screen=list|detail|form, ?fx=1|0 (imersivo/contido) e ?size=m|p
  (janela média/pequena). Dados de mentira, tudo em memória. Abra com duplo clique.
  Vive só no galho prototype/luc-119-identidade-visual; o main guarda só a decisão.
  Referências: docs/research/2026-10-24-referencias-visuais-batcomputador.md (direções 1 e 2; C é híbrido das duas).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Special+Elite&family=Courier+Prime:wght@400;700&family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;500;700&family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ---------- moldura do protótipo (neutra, não faz parte do design) ---------- */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#2b2b2f;background-image:radial-gradient(#3a3a40 1px,transparent 1px);background-size:18px 18px;
  display:grid;place-items:center;padding:24px 16px 96px;font-family:system-ui,sans-serif;overflow:auto}
.win{width:880px;height:580px;max-width:calc(100vw - 32px);max-height:calc(100vh - 140px);display:flex;flex-direction:column;
  border:1px solid #000;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);transition:width .25s,height .25s}
.win.p{width:480px;height:640px}
.titlebar{height:30px;flex:none;background:#1f1f1f;color:#ddd;font:12px "Segoe UI",system-ui,sans-serif;
  display:flex;align-items:center;padding-left:12px;user-select:none}
.titlebar .t{flex:1;opacity:.85}
.titlebar span.w{width:46px;height:30px;display:grid;place-items:center;opacity:.7}
.app{flex:1;min-height:0;position:relative;overflow:hidden}
.app button{cursor:pointer;font:inherit;color:inherit}
.app button:disabled{cursor:default;opacity:.45}
.app input{font:inherit;color:inherit;min-width:0}
.app .log{overflow:auto;min-height:0}
.app .ln{display:grid;white-space:pre-wrap;word-break:break-all}
.app .menu{position:absolute;right:0;top:calc(100% + 4px);z-index:20;display:flex;flex-direction:column;min-width:130px}
.app .a-row:nth-last-child(-n+2) .menu,.app .b-mod:nth-last-child(-n+2) .menu{top:auto;bottom:calc(100% + 4px)}
.app .menu button{text-align:left;background:none;border:0}
.app .ov{position:absolute;inset:0;z-index:50;display:grid;place-items:center}
.app .toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;pointer-events:none;white-space:nowrap;animation:toast 2.6s forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

@media (prefers-reduced-motion:reduce){.app *,.app::before,.app::after{animation:none!important}}

/* barra flutuante do protótipo */
#bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:999;display:flex;align-items:center;gap:6px;
  background:#fafafa;color:#111;border-radius:999px;padding:6px 8px;font:13px system-ui,sans-serif;
  box-shadow:0 8px 30px rgba(0,0,0,.45);white-space:nowrap;max-width:calc(100vw - 16px);overflow-x:auto}
#bar button{border:0;background:#ececec;border-radius:999px;padding:6px 11px;font:inherit;cursor:pointer;color:#111}
#bar button:hover{background:#dcdcdc}
#bar button.on{background:#111;color:#fff}
#bar .arrow{width:32px;padding:6px 0;font-size:16px;line-height:1}
#bar .lbl{min-width:240px;text-align:center}
#bar .lbl b{display:inline-block;background:#111;color:#fff;border-radius:6px;padding:0 6px;margin-right:6px}
#bar .lbl small{display:block;color:#666;font-size:11px}
#bar .sep{width:1px;height:22px;background:#ccc;margin:0 4px}
#bar .seg{display:flex;gap:2px}

/* ======================================================================
   A · ARQUIVO DE CASO (noir, The Batman 2022)
   ====================================================================== */
.vA{--bg:#0e0d0c;--bg2:#171513;--ink:#e6dfd3;--mute:#8c8378;--line:#2e2a26;--red:#c8322b;--err:#e5483d;--amber:#d9a441;--stop:#8a8178;
  background:radial-gradient(120% 70% at 50% -10%,rgba(200,55,45,.10),transparent 60%),var(--bg);
  color:var(--ink);font:13px/1.4 "IBM Plex Mono",monospace}
.vA .a-root{height:100%;display:flex;flex-direction:column;padding:16px 22px 12px;position:relative}
.vA .log{position:relative;z-index:6}
.vA .a-proj{font-family:"Courier Prime",monospace}
.vA .a-proj b{font-size:15px}
.vA .a-head{display:grid;grid-template-columns:1fr auto;align-items:end;gap:2px 12px;border-bottom:2px solid var(--red);padding-bottom:10px}
.vA .a-kicker{font:11px "Special Elite",monospace;letter-spacing:.14em;color:var(--mute)}
.vA .a-head .a-kicker{grid-column:1/-1}
.vA .a-title{font:800 40px/.9 "Big Shoulders Display",sans-serif;letter-spacing:.05em;margin:0;text-transform:uppercase}
.vA .a-title i{font-style:normal;color:var(--red)}
.vA .a-add,.vA .a-primary{font:13px "Special Elite",monospace;letter-spacing:.1em;background:none;border:1px solid var(--ink);padding:7px 12px}
.vA .a-add:hover,.vA .a-primary:hover:not(:disabled){background:var(--red);border-color:var(--red)}
.vA .a-primary{background:var(--ink);color:var(--bg)!important}
.vA .a-ledger{flex:1;min-height:0;overflow:auto;margin-top:4px}
.vA .a-row{display:grid;grid-template-columns:34px 1fr 112px 200px;align-items:center;gap:10px;min-height:48px;padding:0 6px;
  border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.vA .a-row:not(.a-hrow):hover{background:linear-gradient(90deg,rgba(200,55,45,.10),transparent 70%)}
.vA .a-hrow{min-height:30px;cursor:default;font:10.5px "Special Elite",monospace;letter-spacing:.14em;color:var(--mute);position:sticky;top:0;background:var(--bg);z-index:2}
.vA .a-num{color:var(--mute);font-size:11px}
.vA .a-proj{min-width:0}
.vA .a-proj b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vA .a-proj i{display:block;font-style:normal;color:var(--mute);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vA .a-stamp{display:inline-block;font:13px/1 "Special Elite",monospace;letter-spacing:.1em;border:1.5px solid currentColor;padding:4px 7px 3px;border-radius:2px;transform:rotate(-2deg)}
.vA .a-stamp.s-stop{color:var(--stop)}
.vA .a-stamp.s-run{color:var(--amber)}
.vA .a-stamp.s-err{color:var(--err);transform:rotate(1.5deg)}
.vA .a-stamp.s-busy{color:var(--mute);border-style:dashed}
.vA .a-stamp.big{font-size:20px;padding:7px 12px 5px;border-width:2.5px;transform:rotate(-5deg)}
.vA .a-stamp.big.s-err{transform:rotate(4deg)}
.vA.fx .a-stamp{filter:url(#rough)}
.vA .a-acts{display:flex;align-items:center;justify-content:flex-end;gap:6px;position:relative}
.vA .a-btn{background:none;border:1px solid #3a302a;font:600 11px "IBM Plex Mono",monospace;letter-spacing:.1em;padding:6px 10px}
.vA .a-btn:hover:not(:disabled){border-color:var(--ink)}
.vA .a-btn.on{border-color:var(--amber);color:var(--amber)}
.vA .a-dots{background:none;border:0;font-size:18px;padding:0 4px;color:var(--mute)}
.vA .a-link{background:none;border:0;border-bottom:1px solid currentColor;padding:1px 0;font-size:11.5px;color:var(--amber)}
.vA .a-foot{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px;margin-top:8px;font:11px "Special Elite",monospace;letter-spacing:.08em;color:var(--mute)}
.vA .a-empty{flex:1;display:grid;place-content:center;text-align:center;gap:10px}
.vA .a-empty h2{font:800 30px "Big Shoulders Display";letter-spacing:.06em;margin:0}
.vA .a-empty p{margin:0 0 6px;color:var(--mute);font-family:"Special Elite"}
.vA .menu{background:var(--bg2);border:1px solid #3a302a;padding:4px;box-shadow:0 12px 30px rgba(0,0,0,.6)}
.vA .menu button{padding:7px 10px;font:12px "Special Elite"}
.vA .menu button:hover{background:#221b17}
.vA .menu .danger{color:var(--red)}
.vA .a-topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.vA .a-back{background:none;border:0;padding:0;font:12px "Special Elite";letter-spacing:.1em;color:var(--mute)}
.vA .a-back:hover{color:var(--ink)}
.vA .a-dossier{border-bottom:2px solid var(--red);padding-bottom:12px}
.vA .a-dhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.vA .a-name{font-size:34px;text-transform:none;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis}
.vA .a-meta{display:grid;grid-template-columns:150px 1fr;gap:3px 12px;margin:10px 0 12px}
.vA .a-meta dt{font:11px "Special Elite";letter-spacing:.12em;color:var(--mute);border-bottom:1px dotted #3a302a}
.vA .a-meta dd{margin:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vA .a-dacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vA .a-dacts .sp{flex:1}
.vA .a-trans{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:10px}
.vA .a-trans-h{display:flex;justify-content:space-between;font:11px "Special Elite";letter-spacing:.14em;color:var(--mute);margin-bottom:6px}
.vA .log{flex:1;font:12px/1.6 "IBM Plex Mono",monospace;background:rgba(0,0,0,.25);border:1px solid var(--line);padding:6px 0}
.vA .ln{grid-template-columns:42px 1fr;padding-right:10px}
.vA .ln .n{color:#5a3a33;text-align:right;padding-right:10px;user-select:none}
.vA .ln .t{display:none}
.vA .ln.err{color:#ec7a70;background:rgba(200,55,45,.08)}
.vA .ln.err .n{color:var(--red)}
.vA .ln.sys{color:var(--mute);font-style:italic}
.vA .log-empty{padding:30px 16px;text-align:center;color:var(--mute);font-family:"Special Elite"}
.vA .a-form{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:16px;padding:14px 2px}
.vA .a-f{display:flex;flex-direction:column;gap:4px}
.vA .a-f>span{font:11px "Special Elite";letter-spacing:.14em;color:var(--mute)}
.vA .a-f>span em{font-style:normal;opacity:.7}
.vA .a-f input{background:none;border:0;border-bottom:1px dashed #5b4f45;padding:5px 0;font-size:14px;outline:none}
.vA .a-f input:focus{border-bottom:1px solid var(--red)}
.vA .a-inrow{display:flex;gap:10px;align-items:end}
.vA .a-inrow input{flex:1}
.vA .a-radio{display:flex;align-items:center;gap:10px;background:none;border:0;padding:3px 0;font-size:13.5px;text-align:left}
.vA .a-radio::before{content:"( )";color:var(--mute);white-space:pre}
.vA .a-radio.on::before{content:"(●)";color:var(--red)}
.vA .a-hint{color:var(--mute);font-family:"Special Elite";font-size:12px}
.vA .a-warn{border-left:3px solid var(--amber);padding:6px 10px;margin-top:10px;font-family:"Special Elite";font-size:12.5px;color:var(--amber);background:rgba(221,154,59,.07)}
.vA .a-warn.err{border-color:var(--red);color:#ec7a70;background:rgba(200,55,45,.08)}
.vA .a-formacts{display:flex;gap:16px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.vA .ov{background:rgba(5,4,3,.75)}
.vA .dlg{background:var(--bg2);border:1px solid #3a302a;border-top:3px solid var(--red);padding:18px 20px;width:min(360px,86%)}
.vA .dlg h3{margin:0 0 6px;font:800 24px "Big Shoulders Display";letter-spacing:.04em;text-transform:uppercase}
.vA .dlg p{margin:0 0 16px;color:var(--mute);font-family:"Special Elite"}
.vA .dlg .acts{display:flex;gap:10px;justify-content:flex-end}
.vA .dlg .yes{background:var(--red);border:0;padding:7px 12px;font:13px "Special Elite"}
.vA .dlg .no{background:none;border:1px solid #3a302a;padding:7px 12px;font:13px "Special Elite"}
.vA .toast{background:var(--ink);color:var(--bg);font:12px "Special Elite";padding:7px 12px}
.vA.size-p .a-row{grid-template-columns:1fr auto;grid-template-areas:"p s" "p a";padding:8px 4px;gap:6px 10px}
.vA.size-p .a-row .a-num{display:none}
.vA.size-p .a-hrow{display:none}
.vA.size-p .a-proj{grid-area:p}
.vA.size-p .a-row>span:nth-child(3){grid-area:s}
.vA.size-p .a-acts{grid-area:a;justify-content:flex-end}
.vA.size-p .a-title{font-size:32px}
.vA.size-p .a-name{font-size:26px}
.vA.size-p .a-meta{grid-template-columns:118px 1fr}
.vA.size-p .a-stamp.big{font-size:15px}
/* imersivo: grão de filme, chuva e luz de sódio */
.vA.fx::before{content:"";position:absolute;inset:-50%;z-index:5;pointer-events:none;opacity:.10;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain .9s steps(6) infinite}
.vA.fx::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;
  background:repeating-linear-gradient(104deg,transparent 0 46px,rgba(228,220,205,.045) 46px 47px,transparent 47px 91px),
    radial-gradient(130% 100% at 50% 40%,transparent 55%,rgba(0,0,0,.55));
  background-size:200px 300px,100% 100%;animation:rain .55s linear infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-4%,3%)}40%{transform:translate(3%,-5%)}60%{transform:translate(-6%,2%)}80%{transform:translate(5%,4%)}}
@keyframes rain{to{background-position:-60px 300px,0 0}}
.vA.fx .a-stamp.s-err{animation:neon 4s infinite}
@keyframes neon{0%,93%,100%{opacity:1}94%{opacity:.35}96%{opacity:1}97%{opacity:.5}}

/* ======================================================================
   B · HOLOGRAMA (ciano, BvS / Arkham)
   ====================================================================== */
.vB{--bg:#05090d;--panel:rgba(16,58,72,.26);--line:rgba(63,216,255,.22);--cyan:#3fd8ff;--ice:#d2f1ff;--mute:#6f8c9e;--amber:#f2b33d;--red:#ff5c4d;--stop:#6a8698;
  --ch:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));
  background:radial-gradient(90% 60% at 50% -15%,rgba(63,216,255,.16),transparent 65%),var(--bg);
  color:var(--ice);font:13px/1.45 "Share Tech Mono",monospace}
.vB.fx{background:radial-gradient(90% 60% at 50% -15%,rgba(63,216,255,.2),transparent 65%),
  linear-gradient(rgba(63,216,255,.04) 1px,transparent 1px) 0 0/100% 24px,
  linear-gradient(90deg,rgba(63,216,255,.04) 1px,transparent 1px) 0 0/24px 100%,var(--bg)}
.vB .b-root{height:100%;display:flex;flex-direction:column;padding:14px 16px;gap:10px;position:relative;z-index:1}
.vB .b-hud{display:flex;align-items:stretch;justify-content:space-between;border:1px solid var(--line);clip-path:var(--ch);background:var(--panel);padding:8px 12px}
.vB .b-logo{display:flex;align-items:center;gap:10px;font:700 18px "Chakra Petch",sans-serif;letter-spacing:.28em;color:var(--cyan)}
.vB .b-logo small{display:block;font:10px "Share Tech Mono";letter-spacing:.16em;color:var(--mute)}
.vB .b-gem{width:22px;height:22px;border:1.5px solid var(--cyan);transform:rotate(45deg);position:relative;flex:none}
.vB .b-gem::after{content:"";position:absolute;inset:5px;background:var(--cyan)}
.vB .b-tele{display:flex}
.vB .b-tele div{border-left:1px solid var(--line);padding:0 12px;display:flex;flex-direction:column;justify-content:center}
.vB .b-tele em{font-style:normal;font-size:9.5px;letter-spacing:.2em;color:var(--mute)}
.vB .b-tele b{font:600 17px "Chakra Petch";color:var(--ice)}
.vB .b-tele b.err{color:var(--red)}
.vB .b-tele b.run{color:var(--cyan)}
.vB .b-bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.vB .b-cap{font-size:11px;letter-spacing:.2em;color:var(--mute)}
.vB .b-cap b{color:var(--cyan);font-weight:400}
.vB .b-btn{font:600 11px "Chakra Petch";letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)!important;background:rgba(63,216,255,.07);
  border:1px solid var(--cyan);padding:6px 12px;clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,7px 100%,0 calc(100% - 7px))}
.vB .b-btn:hover:not(:disabled){background:var(--cyan);color:var(--bg)!important}
.vB .b-btn.warn{color:var(--amber)!important;border-color:var(--amber);background:rgba(255,179,71,.07)}
.vB .b-btn.warn:hover:not(:disabled){background:var(--amber);color:var(--bg)!important}
.vB .b-btn.ghost{border-color:var(--line);color:var(--ice)!important;background:none}
.vB .b-btn.sq{padding:6px 9px}
.vB .b-grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;padding-right:2px}
.vB .b-mod{position:relative;background:var(--panel);border:1px solid var(--line);clip-path:var(--ch);padding:10px 12px 10px 15px;cursor:pointer;
  display:flex;flex-direction:column;gap:5px;box-shadow:inset 3px 0 0 var(--k,var(--stop))}
.vB .b-mod:hover{background:rgba(26,84,102,.32)}
.vB .b-mod.st-run{--k:var(--cyan);border-color:rgba(63,216,255,.45)}

.vB .b-mtop{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.2em}

.vB .b-up{margin-left:auto;color:var(--mute);letter-spacing:.08em}

.vB .b-fault{height:20px;font-size:11.5px;color:var(--red);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:20px}
.vB .b-load{height:20px;background:linear-gradient(90deg,transparent,var(--amber),transparent) 0 50%/40% 2px no-repeat;animation:load 1s linear infinite}
@keyframes load{from{background-position:-40% 50%}to{background-position:140% 50%}}
.vB .b-macts{display:flex;gap:6px;align-items:center;position:relative;margin-top:2px}
.vB .menu{background:#06141a;border:1px solid var(--cyan);padding:4px;box-shadow:0 0 24px rgba(63,216,255,.2)}
.vB .menu button{padding:7px 10px;font:12px "Share Tech Mono";letter-spacing:.12em;text-transform:uppercase}
.vB .menu button:hover{background:rgba(63,216,255,.12)}

.vB .log-empty{padding:30px;color:var(--mute);text-align:center;letter-spacing:.1em}
.vB .b-form{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px}
.vB .b-sec{display:grid;grid-template-columns:36px 1fr;gap:10px;border:1px solid var(--line);background:var(--panel);padding:10px 12px;clip-path:var(--ch)}

/* imersivo: scanlines, brilho, tremulação, boot */
.vB.fx::after{content:"";position:absolute;inset:0;z-index:30;pointer-events:none;
  background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.28) 2px 3px);mix-blend-mode:multiply}
.vB.fx::before{content:"";position:absolute;left:0;right:0;height:120px;z-index:31;pointer-events:none;
  background:linear-gradient(transparent,rgba(63,216,255,.06),transparent);animation:sweep 5s linear infinite}
@keyframes sweep{from{top:-120px}to{top:100%}}
.vB.fx .b-logo,.vB.fx .b-st,.vB.fx .b-tele b,.vB.fx .b-ringc b,.vB.fx .b-cap b{text-shadow:0 0 10px currentColor}
.vB.fx .b-mod.st-run{box-shadow:inset 3px 0 0 var(--k),inset 0 0 28px rgba(63,216,255,.10)}
.vB.fx .b-mod.st-err{box-shadow:inset 3px 0 0 var(--k),inset 0 0 28px rgba(255,77,94,.12)}

@keyframes flicker{0%,96%,100%{opacity:1}96.5%{opacity:.82}97%{opacity:1}98%{opacity:.9}}
.vB .boot{position:absolute;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:0 12%;gap:4px;
  font-size:13px;letter-spacing:.12em;color:var(--cyan);animation:bootout .3s 1.5s forwards}
.vB .boot div{opacity:0;animation:bootln .01s forwards}
.vB .boot div:nth-child(1){animation-delay:.1s}.vB .boot div:nth-child(2){animation-delay:.35s}.vB .boot div:nth-child(3){animation-delay:.6s}
.vB .boot div:nth-child(4){animation-delay:.85s}.vB .boot div:nth-child(5){animation-delay:1.1s}
.vB .boot span{color:var(--ice)}
@keyframes bootln{to{opacity:1}}
@keyframes bootout{to{opacity:0;visibility:hidden}}

.vD{--g:#070B0E;--rack:#0A1216;--face:#111C22;--face2:#16252E;--rule:#1C2B33;--line:#263943;--ink:#DCEBF2;--mute:#8CA3B0;--dim:#7A93A3;

function dStrip(p){
  const k = stc(p), on = isOn(p);
  return `<div class="d-strip st-${k}${p.id === S.sel ? ' sel' : ''}${p.cocked ? ' cocked' : ''}" data-act="open" data-id="${p.id}" data-flip="${p.id}" role="button" tabindex="0" aria-label="${esc(p.name)}: ${dState(p)}">
    <span class="d-hold">${SHAPE[k]}</span>
    <span class="d-id"><b>${esc(p.name)}</b><code>${esc(p.command)}</code></span>
    <span class="d-cell d-state"><em>${dState(p)}</em>${dTime(p)}</span>
    <span class="d-cell d-port">${p.url ? ':' + port(p.url) : '—'}</span>
    <span class="d-acts">
      ${canOpen(p) ? `<button class="d-btn d-ib" data-act="url" data-id="${p.id}" title="Abrir no navegador" aria-label="Abrir no navegador">${ic('ext')}</button>` : '<span class="d-ph"></span>'}
      <button class="d-btn d-ib${on ? '' : ' go'}" data-act="toggle" data-id="${p.id}" title="${dTogLabel(p)}" aria-label="${dTogLabel(p)}" ${p.pending ? 'disabled' : ''}>${ic(on ? 'stop' : 'play')}</button>
      <button class="d-btn d-ib" data-act="menu" data-id="${p.id}" title="Mais ações" aria-label="Mais ações">${ic('more')}</button>
    </span>
  </div>`;
}
function dBoard(){
  const ps = projects();
  if (!ps.length) return `<div class="d-board"><div class="d-empty">
    <div class="d-ghost" aria-hidden="true"><span class="d-hold"></span><span></span><span></span></div>
    <h2>Cada projeto vira uma faixa.</h2>
    <p>Cadastre a pasta e o comando uma vez. Depois é só ligar, desligar e ler o log daqui, sem abrir o cmd.</p>
    <button class="d-btn pri" data-act="add">${ic('plus')}Cadastrar o primeiro projeto</button></div></div>`;
  return `<div class="d-board" data-scroll="board">${DBAYS.map(([k, label, none, f]) => {
    const xs = ps.filter(f);
    return `<section class="d-bay b-${k}" aria-label="${label}"><header class="d-bayh"><h2>${label}</h2><span class="n">${xs.length}</span><span class="rule"></span></header>
      <div class="d-slots">${xs.length ? xs.map(dStrip).join('') : `<div class="d-vazio">${none}</div>`}</div></section>`;
  }).join('')}</div>`;
}
function dTop(){
  const ps = projects(), n = counts();
  return `<header class="d-top"><span class="d-mark">${MARK}</span><b class="d-name">Bat-Computer</b>
    ${ps.length ? `<span class="d-sum">${n.run} ${n.run === 1 ? 'ativo' : 'ativos'} · ${n.err} em falha · ${ps.length - n.run - n.err} em espera</span>` : ""}
    <span class="d-clock mono" data-clock></span>
    <button class="d-btn pri" data-act="add">${ic('plus')}Novo projeto</button></header>`;
}
function dTx(p, back){
  const on = isOn(p);
  return `<section class="d-tx">
    <header class="d-txh">
      <div class="d-txid">${back ? `<button class="d-back" data-act="back">${ic('back')}Quadro</button>` : ''}<h1>${esc(p.name)}</h1></div>
      <div class="d-txacts">
        <button class="d-btn${on ? '' : ' go'}" data-act="toggle" data-id="${p.id}" ${p.pending ? 'disabled' : ''}>${ic(on ? 'stop' : 'play')}${dTogLabel(p)}</button>
        ${canOpen(p) ? `<button class="d-btn d-ib" data-act="url" data-id="${p.id}" title="Abrir no navegador" aria-label="Abrir no navegador">${ic('ext')}</button>` : ''}
        <button class="d-btn d-ib" data-act="edit" data-id="${p.id}" title="Editar" aria-label="Editar">${ic('edit')}</button>
        <button class="d-btn d-ib danger" data-act="del" data-id="${p.id}" title="Apagar" aria-label="Apagar">${ic('trash')}</button>
      </div>
      <code class="d-path" title="${esc(p.path)}">${esc(p.path)}</code>
    </header>
    ${S.confirm === p.id ? `<div class="d-confirm" role="alert"><span>Apagar <b>${esc(p.name)}</b>? ${on ? 'O processo será desligado antes. ' : ''}O log também some.</span>
      <button class="d-btn" data-act="del-no">Cancelar</button><button class="d-btn danger-fill" data-act="del-yes" data-id="${p.id}">Apagar</button></div>` : ''}
    <div class="d-facts st-${stc(p)}">
      <div><em>Estado</em><span class="d-st">${SHAPE[stc(p)]}${dState(p)}</span></div>
      <div><em>${on ? 'No ar há' : p.status === 'ERRO' ? 'Saiu com' : 'Tempo no ar'}</em>${dTime(p)}</div>
      <div><em>Comando</em><code>${esc(p.command)}</code></div>
      <div><em>Endereço</em><code>${p.url ? esc(p.url.replace(/^https?:\/\//, '')) : '—'}</code></div>
    </div>
    <div class="d-logh"><h2>Log</h2><span class="mono">${LOGS[p.id].length} / 1000 linhas</span></div>
    ${logHtml(p, 'Nada por aqui ainda. Ligue o projeto para ver a saída do processo.')}
  </section>`;
}
function dForm(f){
  const m = cmdModel(f);
  const cmd = (f.cmd === '__custom' || !f.scripts.length) ? f.customCmd : f.cmd;
  const fp = f.mode === 'edit' ? PROJ.find(x => x.id === f.id) : null, fk = fp ? stc(fp) : 'stop';
  const locked = !!fp && (isOn(fp) || !!fp.pending), dis = locked ? 'disabled' : '';
  return `<section class="d-form">
    <header class="d-txh"><div class="d-txid">${S.size === 'p' ? `<button class="d-back" data-act="cancel">${ic('back')}Quadro</button>` : ''}<h1>${f.mode === 'add' ? 'Novo projeto' : 'Editar projeto'}</h1></div></header>
    <div class="d-fbody" data-scroll="form">
      <div class="d-preview" aria-hidden="true"><div class="d-strip st-${fk}"><span class="d-hold">${SHAPE[fk]}</span>
        <span class="d-id"><b data-pv="name">${esc(f.name) || 'nome-do-projeto'}</b><code data-pv="cmd">${esc(cmd) || 'comando'}</code></span>
        <span class="d-cell d-state"><em>${fp ? dState(fp) : "Parado"}</em>${fp ? dTime(fp) : `<span class="mono dim">—</span>`}</span></div>
        <small>${f.mode === 'add' ? 'A faixa entra no quadro em espera.' : 'Assim a faixa aparece no quadro.'}</small></div>
      ${locked ? `<div class="d-note">${ic('lock')}<span>Este projeto está rodando. Desligue-o para editar.</span><button class="d-btn" data-act="toggle" data-id="${fp.id}" ${fp.pending ? 'disabled' : ''}>${ic('stop')}${fp.pending ? 'Desligando…' : 'Desligar'}</button></div>` : ''}
      ${f.error ? `<div class="d-note err" role="alert">${esc(f.error)}</div>` : ''}
      <label class="d-f"><span>Nome</span><input data-f="name" value="${esc(f.name)}" placeholder="meu-projeto" ${dis}></label>
      <div class="d-f"><span>Pasta</span><div class="d-inrow"><input data-f="path" value="${esc(f.path)}" placeholder="C:\\Projetos\\meu-projeto" aria-label="Pasta" ${dis}><button class="d-btn" data-act="browse" ${dis}>${ic('folder')}Procurar…</button></div></div>
      <div class="d-f"><span>Comando</span>${m.hint ? `<p class="d-hint">${m.hint}</p>` : ''}
        ${m.opts.length ? `<div class="d-opts" role="radiogroup" aria-label="Comando">${m.opts.map(o => `<button class="d-opt${o.on ? ' on' : ''}" role="radio" aria-checked="${o.on}" data-act="pick" data-v="${esc(o.v)}" ${dis}><i></i>${o.label ? esc(o.label) : `<code>${esc(o.v)}</code>`}</button>`).join('')}</div>` : ''}
        ${m.showFree ? `<input data-f="customCmd" value="${esc(f.customCmd)}" placeholder="python -m http.server 8080" aria-label="Comando livre" ${dis}>` : ''}</div>
      <label class="d-f"><span>Endereço <small>opcional</small></span><input data-f="url" value="${esc(f.url)}" placeholder="http://localhost:5173" ${dis}></label>
    </div>
    <footer class="d-ffoot"><button class="d-btn" data-act="cancel">Cancelar</button><button class="d-btn pri" data-act="save" ${dis}>${ic('check')}${f.mode === 'add' ? 'Adicionar ao quadro' : 'Salvar'}</button></footer>
  </section>`;
}
function dMenu(){
  const p = PROJ.find(x => x.id === S.menu);
  if (!p || !S.menuPos) return '';
  return `<div class="menu d-menu" style="left:${S.menuPos.x}px;top:${S.menuPos.y}px">
    <button data-act="open" data-id="${p.id}">${ic('log')}Ver log</button>
    <button data-act="edit" data-id="${p.id}">${ic('edit')}Editar</button>
    <button class="danger" data-act="del" data-id="${p.id}">${ic('trash')}Apagar</button></div>`;
}
function dRender(){
  const s = screenNow(), ps = projects(), small = S.size === 'p';
  if (ps.length && !sel()) S.sel = ps[0].id;
  const p = sel();
  let body, solo = small;
  if (small) body = s === 'form' ? dForm(S.form) : (s === 'detail' && p) ? dTx(p, true) : dBoard();
  else if (!ps.length && s !== 'form') { body = dBoard(); solo = true; }
  else body = dBoard() + (s === 'form' ? dForm(S.form) : dTx(p, false));
  return `<div class="d-root">${dTop()}<div class="d-body${solo ? ' solo' : ''}">${body}</div>${dMenu()}</div>`;
}

// ---------------- registro das variações ----------------
const V = {
  A: { name:'Arquivo de Caso', tag:'noir · The Batman (2022) · Territory Studio', render(){ const s = screenNow(); return s === 'detail' ? aDetail(sel()) : s === 'form' ? aForm(S.form) : aList(); } },
  B: { name:'Holograma', tag:'ciano · BvS (Perception) / Arkham', render(){ const s = screenNow(); return s === 'detail' ? bDetail(sel()) : s === 'form' ? bForm(S.form) : bList(); } },
  C: { name:'Console de Sonar', tag:'híbrido · noir + ciano', render: cRender },
  D: { name:'Quadro de Faixas', tag:'escolhida · faixas de controle de voo', render: dRender },
};
const KEYS = Object.keys(V);

// ---------------- render ----------------
const app = document.getElementById('app'), win = document.getElementById('win'), bar = document.getElementById('bar');
function render(){
  const saved = {};
  app.querySelectorAll('[data-scroll]').forEach(el => saved[el.dataset.scroll] = { top: el.scrollTop, bottom: el.scrollHeight - el.scrollTop - el.clientHeight < 40 });
  const before = {};
  if (S.variant === 'D') app.querySelectorAll('[data-flip]').forEach(el => before[el.dataset.flip] = el.getBoundingClientRect());
  app.className = `app v${S.variant} size-${S.size}${S.fx ? ' fx' : ''}`;
  app.innerHTML = V[S.variant].render() + overlays();
  app.querySelectorAll('[data-scroll]').forEach(el => {
    const sv = saved[el.dataset.scroll];
    if (el.classList.contains('log')) el.scrollTop = (!sv || sv.bottom) ? el.scrollHeight : sv.top;
    else if (sv) el.scrollTop = sv.top;
  });
  // D: a faixa desliza da baia antiga para a nova (FLIP)
  if (S.variant === 'D' && S.fx && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    app.querySelectorAll('[data-flip]').forEach(el => {
      const b = before[el.dataset.flip]; if (!b) return;
      const a = el.getBoundingClientRect(), dx = b.left - a.left, dy = b.top - a.top;
      if (Math.abs(dy) < 2 && Math.abs(dx) < 2) return;
      el.animate([{ transform:`translate(${dx}px,${dy}px)` }, { transform:'none' }], { duration:300, easing:'cubic-bezier(.16,1,.3,1)' });
      el.querySelector('.d-hold')?.animate([{ filter:'brightness(1.7)' }, { filter:'none' }], { duration:600, delay:200, easing:'ease-out' });
    });
  }
  win.classList.toggle('p', S.size === 'p');
  tick(true);
  renderBar();
  const q = new URLSearchParams({ variant:S.variant, screen:S.screen, fx:S.fx ? '1' : '0', size:S.size });
  if (S.empty) q.set('empty', '1');
  history.replaceState(null, '', '?' + q);
}
function renderBar(){
  const v = V[S.variant];
  const scr = [['list','Lista'],['detail','Detalhes'],['form','Formulário']];
  bar.innerHTML = `<button class="arrow" data-b="prev" title="←">‹</button>
    <span class="lbl"><b>${S.variant}</b>${v.name}<small>${v.tag}</small></span>
    <button class="arrow" data-b="next" title="→">›</button><span class="sep"></span>
    <div class="seg">${scr.map(([k, l]) => `<button data-b="screen" data-v="${k}" class="${screenNow() === k ? 'on' : ''}">${l}</button>`).join('')}</div><span class="sep"></span>
    <button data-b="fx" class="${S.fx ? 'on' : ''}">${S.fx ? 'Efeitos: imersivo' : 'Efeitos: contido'}</button>
    <button data-b="size">${S.size === 'p' ? 'Janela: pequena 480×640' : 'Janela: média 880×580'}</button>
    <button data-b="empty" class="${S.empty ? 'on' : ''}">Lista vazia</button>`;
}
function go(screen){ S.screen = screen; S.menu = null; if (screen !== 'form') S.form = null; render(); }
function setVariant(k){
  S.variant = k; S.menu = null; S.confirm = null;
  S.boot = k === 'B' && S.fx;
  render();
  if (S.boot) setTimeout(() => { S.boot = false; app.querySelector('.boot')?.remove(); }, 1900);
}
function toast(msg){ S.toast = { msg, k: Date.now() }; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = null; app.querySelector('.toast')?.remove(); }, 2600); }

// ---------------- processo de mentira ----------------
function push(p, x, s='out'){
  const ls = LOGS[p.id], l = { t: ts(Date.now()), x, s };
  ls.push(l); if (ls.length > 1000) ls.shift();
  const el = app.querySelector(`[data-log="${p.id}"]`);
  if (!el) return;
  el.querySelector('.log-empty')?.remove();
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  el.insertAdjacentHTML('beforeend', lineHtml(l, ls.length - 1));
  if (atBottom) el.scrollTop = el.scrollHeight;
}
function start(p){
  p.pending = 'start'; render();
  setTimeout(() => {
    p.pending = null;
    if (p.id === 'p2') {
      ['> api-financas@1.0.0 start','> node src/server.js'].forEach(x => push(p, x));
      ["Error: Cannot find module 'dotenv'",'Require stack:','- C:\\Projetos\\api-financas\\src\\server.js',"  code: 'MODULE_NOT_FOUND',"].forEach(x => push(p, x, 'err'));
      push(p, '[processo encerrado com código 1]', 'sys');
      p.status = 'ERRO'; p.exitCode = 1; p.cocked = true;
    } else {
      (START[p.id] || [`> ${p.command}`, 'pronto.']).forEach(x => push(p, x));
      p.status = 'RODANDO'; p.since = Date.now(); p.exitCode = null;
    }
    render();
  }, 1100);
}
function stop(p){
  p.pending = 'stop'; render();
  setTimeout(() => { p.pending = null; p.status = 'PARADO'; p.since = null; push(p, '[processo encerrado pelo Bat-Computer]', 'sys'); render(); }, 700);
}
function tick(onlyText){
  app.querySelectorAll('[data-clock]').forEach(el => el.textContent = ts(Date.now()));
  app.querySelectorAll('[data-up]').forEach(el => { const p = PROJ.find(x => x.id === el.dataset.up); if (p) el.textContent = uptime(p); });
  if (onlyText) return;
  PROJ.filter(p => isOn(p) && !p.pending).forEach(p => {
    if (Math.random() < 0.3) { const pool = POOL[p.id] || POOL._; push(p, pool[Math.random() * pool.length | 0], Math.random() < .06 ? 'err' : 'out'); }
  });
}
setInterval(() => tick(false), 1000);

// ---------------- eventos ----------------
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (S.menu) { S.menu = null; render(); } return; }
  const id = el.dataset.id, p = PROJ.find(x => x.id === id), f = S.form;
  switch (el.dataset.act) {
    case 'open': S.sel = id; if (p) p.cocked = false; go('detail'); break;
    case 'toggle': if (!p.pending) (isOn(p) ? stop : start)(p); break;
    case 'url': toast(`Abriria ${p.url} no navegador padrão`); break;
    case 'menu': {
      S.menu = S.menu === id ? null : id;
      const r = el.getBoundingClientRect(), a = app.getBoundingClientRect();
      S.menuPos = { x: Math.max(8, r.right - a.left - 150), y: r.bottom - a.top + 124 > a.height ? r.top - a.top - 116 : r.bottom - a.top + 4 };
      render(); break;
    }
    case 'edit': S.sel = id; S.menu = null; S.form = newForm('edit', p); S.screen = 'form'; render(); break;
    case 'del': S.menu = null; S.confirm = id; if (S.variant === 'D') { S.sel = id; if (S.size === 'p') S.screen = 'detail'; } render(); break;
    case 'del-no': S.confirm = null; render(); break;
    case 'del-yes': {
      PROJ.splice(PROJ.indexOf(p), 1); S.confirm = null;
      if (S.sel === id) S.sel = PROJ[0]?.id; go('list'); toast(`${p.name} apagado`); break;
    }
    case 'add': S.form = newForm('add'); S.screen = 'form'; S.menu = null; render(); break;
    case 'back': go('list'); break;
    case 'cancel': go(f?.mode === 'edit' ? 'detail' : 'list'); break;
    case 'pick': f.cmd = el.dataset.v; render(); break;
    case 'browse':
      f.path = 'C:\\Projetos\\novo-projeto'; f.scripts = ['dev','build','preview','lint']; f.cmd = 'npm run dev';
      if (!f.name) f.name = 'novo-projeto'; f.error = null; render(); break;
    case 'save': save(); break;
  }
});
app.addEventListener('input', e => {
  const k = e.target.dataset.f; if (!k || !S.form) return;
  S.form[k] = e.target.value;
  const pv = app.querySelector(`[data-pv="${k === 'customCmd' ? 'cmd' : k}"]`);
  if (pv) pv.textContent = e.target.value || (k === 'name' ? 'nome-do-projeto' : 'comando');
});
app.addEventListener('change', e => {
  if (e.target.dataset.f !== 'path' || !S.form) return;
  const f = S.form; f.scripts = f.path && !/oee|python/i.test(f.path) ? ['dev','build','start'] : [];
  if (!f.scripts.includes(f.cmd.replace('npm run ', ''))) f.cmd = f.scripts.length ? 'npm run ' + f.scripts[0] : '';
  render();
});
function save(){
  const f = S.form, cmd = (f.cmd === '__custom' || !f.scripts.length) ? f.customCmd : f.cmd;
  if (!f.name.trim() || !f.path.trim() || !cmd.trim()) { f.error = 'Preencha nome, pasta e comando.'; return render(); }
  if (!/^[a-zA-Z]:\\/.test(f.path)) { f.error = `Caminho inexistente: ${f.path}`; return render(); }
  const data = { name:f.name.trim(), path:f.path.trim(), command:cmd.trim(), url:f.url.trim(), scripts:f.scripts };
  if (f.mode === 'add') { const id = 'p' + Date.now(); PROJ.push({ id, status:'PARADO', ...data }); LOGS[id] = []; S.sel = id; S.empty = false; go('list'); toast(`${data.name} cadastrado`); }
  else { Object.assign(PROJ.find(x => x.id === f.id), data); go('detail'); toast('Alterações salvas'); }
}

bar.addEventListener('click', e => {
  const b = e.target.closest('[data-b]'); if (!b) return;
  const i = KEYS.indexOf(S.variant);
  switch (b.dataset.b) {
    case 'prev': setVariant(KEYS[(i + KEYS.length - 1) % KEYS.length]); break;
    case 'next': setVariant(KEYS[(i + 1) % KEYS.length]); break;
    case 'screen': if (b.dataset.v === 'form') { S.form = S.form || newForm('add'); S.screen = 'form'; S.menu = null; render(); } else go(b.dataset.v); break;
    case 'fx': S.fx = !S.fx; render(); break;
    case 'size': S.size = S.size === 'p' ? 'm' : 'p'; render(); break;
    case 'empty': S.empty = !S.empty; S.menu = null; render(); break;
  }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches('input,textarea,[contenteditable]')) { if (e.key === 'Escape' && S.screen === 'form') go(S.form?.mode === 'edit' ? 'detail' : 'list'); if (e.key === 'Enter' && e.ctrlKey && S.form) save(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && t.matches('[role=button][data-act]')) { e.preventDefault(); t.click(); return; }
  const i = KEYS.indexOf(S.variant);
  if (e.key === 'ArrowLeft') setVariant(KEYS[(i + KEYS.length - 1) % KEYS.length]);
  else if (e.key === 'ArrowRight') setVariant(KEYS[(i + 1) % KEYS.length]);
  else if (e.key === 'Escape') { if (S.confirm) { S.confirm = null; render(); } else if (S.screen === 'form') go(S.form?.mode === 'edit' ? 'detail' : 'list'); }
  else if ((S.variant === 'C' || S.variant === 'D') && S.screen !== 'form' && !S.confirm) {
    const ps = S.variant === 'D' ? DBAYS.flatMap(([, , , f]) => projects().filter(f)) : projects(), j = ps.findIndex(p => p.id === S.sel);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const k = ps[(j + (e.key === 'ArrowDown' ? 1 : ps.length - 1)) % ps.length]; if (k) { S.sel = k.id; k.cocked = false; render(); app.querySelector(`[data-flip="${k.id}"]`)?.focus(); } }
    else if (e.key.toLowerCase() === 's' && sel() && !sel().pending) (isOn(sel()) ? stop : start)(sel());
    else if (e.key.toLowerCase() === 'n') { S.form = newForm('add'); S.screen = 'form'; render(); }
  }
});

if (S.screen === 'form') S.form = newForm('add');
setVariant(S.variant);
</script>
</body>
</html>
